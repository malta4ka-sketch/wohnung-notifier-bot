name: Apartment notifier

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check-apartments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore listings database
        uses: actions/cache@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: |
            listings-db-

      - name: Create settings.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "telegram": {
                  "bot_token": os.environ["TELEGRAM_BOT_TOKEN"],
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"]
              },
              "scraper": {
                  "poll_interval_seconds": 120,
                  "suspension_start_hour": 0,
                  "suspension_end_hour": 0
              },
              "scrapers": {
                  "inberlinwohnen": {"enabled": True},
                  "immobilienscout": {"enabled": True},
                  "immowelt": {"enabled": True},
                  "kleinanzeigen": {"enabled": True},
                  "ohnemakler": {"enabled": True},
                  "deutschewohnen": {"enabled": True},
                  "vonovia": {"enabled": True},
                  "berlinovo": {"enabled": True},
                  "sparkasse": {"enabled": True}
              },
              "appliers": {},
              "filters": {
                  "enabled": True,
                  "properties": {
                      "price_total": {
                          "min": None,
                          "max": 2000
                      },
                      "rooms": {
                          "min": 1,
                          "max": 4
                      },
                      "wbs": {
                          "has_wbs": True
                      },
                      "boroughs": {
                          "allowed_values": []
                      }
                  }
              }
          }

          with open("settings.json", "w") as f:
              json.dump(config, f)

          PY

      - name: Test Telegram for all recipients
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          chat_ids = [
              chat_id.strip()
              for chat_id in os.environ["TELEGRAM_CHAT_ID"].split(",")
              if chat_id.strip()
          ]

          print(f"Testing Telegram for {len(chat_ids)} recipient(s)")

          for chat_id in chat_ids:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={
                      "chat_id": chat_id,
                      "text": "🏠 TEST: уведомления о квартирах работают!"
                  },
                  timeout=30
              )

              print(
                  f"Chat ...{chat_id[-4:]}: "
                  f"status={response.status_code}"
              )

              if not response.ok:
                  print(response.text)

              response.raise_for_status()

          PY

      - name: Check apartments
        run: python main.py --cron
